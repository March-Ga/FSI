# Small ID example using the local plane-strain hyperelastic material.
case:
  name: falling_square_neo_hookean
  kind: falling_square
  method: id

time:
  dt: 0.001
  Nt: 20

fluid:
  mode: free_fall
  lx: 1.0
  ly: 1.0
  resolution: 0.05
  rho: 1.0
  mu: 0.01

solid:
  size: 0.2
  center: [0.5, 0.5]
  nx: 4
  ny: 4
  rho: 1.2
  boundary_flag: -2
  material:
    model: neo_hookean
    E: 100.0
    nu: 0.3
    plane_stress: false
    quadrature_order: 2
  body_force:
    acceleration: [0.0, -9.81]
    density_scale: buoyant

coupling:
  transfer_kind: ID
  mass_model: buoyant
  tol: 1.0e-6
  max_iterations: 100
  rayleigh_beta: 0.0
  aitken:
    enabled: true
    omega0: 0.5

output:
  folder: cases/outputs/falling_square_neo_hookean
  file_base: falling_square_neo_hookean
  verbose: true
  print_every: 5
